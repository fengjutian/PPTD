<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>relayout preview</title>
    <style>
      body { margin: 0; background: #dfe3e8; font-family: "Microsoft YaHei", sans-serif; }
      #mount { display: flex; flex-direction: column; gap: 24px; align-items: center; padding: 24px; }
      img { width: 1100px; box-shadow: 0 8px 28px rgba(0,0,0,.22); }
    </style>
  </head>
  <body>
    <div id="mount"></div>
    <script type="module">
      import { produce } from "immer";
      import { applyCommand } from "/src/core/commands/commands.ts";
      import { createDocument, inches } from "/src/core/document-model/index.ts";
      import { renderPresentationForVisualReview } from "/src/services/presentation-renderer.ts";

      const bodyStyle = { fontFamily: "Microsoft YaHei", fontSizePt: 20, color: "#30343A", bold: false, align: "left" };
      const notesStyle = { ...bodyStyle, fontSizePt: 14, color: "#7A4A36", bold: true };
      const titleStyle = { fontFamily: "Microsoft YaHei", fontSizePt: 30, color: "#1B2B4B", bold: true, align: "left" };
      const backgroundItems = [
        "范仲淹因主张改革被贬邓州",
        "受好友滕子京之托撰写",
        "滕子京重修岳阳楼",
        "作者借题发挥寄托政治理想",
        "体现逆境中的豁达心态",
      ];
      const quoteItems = [
        "总写洞庭湖全景",
        "衔远山吞长江浩浩汤汤",
        "描写气象万千的景物",
        "过渡到登楼览物之情",
        "前人之述备矣引出下文",
      ];
      const uid = () => crypto.randomUUID();
      const source = createDocument();
      const layoutId = uid();
      source.layouts = [{ id: layoutId, name: "内页", backgroundColor: "#ffffff" }];
      source.title = "岳阳楼记";
      source.slides = [
        {
          id: uid(),
          layoutId,
          background: "#ffffff",
          content: { title: "写作背景", body: backgroundItems.join("\n"), speakerNotes: "", status: "approved" },
          elements: [
            { id: uid(), type: "text", contentRef: "title", text: "写作背景", frame: { x: inches(0.8), y: inches(0.5), width: inches(8.5), height: inches(0.8) }, rotationMilliDegree: 0, locked: false, style: titleStyle },
            { id: uid(), type: "text", contentRef: "body", text: backgroundItems.slice(0, 3).join("\n\n"), frame: { x: inches(0.8), y: inches(1.8), width: inches(5.2), height: inches(3.4) }, rotationMilliDegree: 0, locked: false, style: bodyStyle },
            { id: uid(), type: "text", contentRef: "body", text: backgroundItems.slice(3).join("\n\n"), frame: { x: inches(6.8), y: inches(1.8), width: inches(5.2), height: inches(3.4) }, rotationMilliDegree: 0, locked: false, style: bodyStyle },
            { id: uid(), type: "image", frame: { x: inches(10.2), y: inches(5.8), width: inches(1.2), height: inches(0.8) }, rotationMilliDegree: 0, locked: false, source: { kind: "embedded", dataUrl: "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAFgwJ/lK3QCwAAAABJRU5ErkJggg==", mimeType: "image/png" }, altText: "手工图片" },
            { id: uid(), type: "text", contentRef: "decorative", text: "手工备注：保留我", frame: { x: inches(1.1), y: inches(6.3), width: inches(4), height: inches(0.35) }, rotationMilliDegree: 0, locked: false, style: notesStyle },
          ],
        },
        {
          id: uid(),
          layoutId,
          background: "#ffffff",
          content: {
            title: "原文赏析",
            body: quoteItems.join("\n"),
            speakerNotes: "",
            status: "approved",
            blocks: [
              { id: uid(), type: "quote", text: "先天下之忧而忧，后天下之乐而乐", attribution: "范仲淹" },
              { id: uid(), type: "bullet-list", items: quoteItems },
            ],
          },
          elements: [
            { id: uid(), type: "text", contentRef: "title", text: "原文赏析", frame: { x: inches(0.8), y: inches(0.5), width: inches(8.5), height: inches(0.8) }, rotationMilliDegree: 0, locked: false, style: titleStyle },
            { id: uid(), type: "text", contentRef: "body", text: quoteItems.slice(0, 3).join("\n\n"), frame: { x: inches(0.8), y: inches(1.8), width: inches(5.2), height: inches(3.4) }, rotationMilliDegree: 0, locked: false, style: bodyStyle },
            { id: uid(), type: "text", contentRef: "body", text: quoteItems.slice(3).join("\n\n"), frame: { x: inches(6.8), y: inches(1.8), width: inches(5.2), height: inches(3.4) }, rotationMilliDegree: 0, locked: false, style: bodyStyle },
          ],
        },
      ];
      const doc = produce(source, (draft) => {
        for (const slide of draft.slides) applyCommand(draft, { type: "relayout-slide", slideId: slide.id });
      });
      window.previewDoc = doc;
      const render = await renderPresentationForVisualReview(doc, 1280);
      const mount = document.getElementById("mount");
      for (const slide of render.slides) {
        const img = document.createElement("img");
        img.src = slide;
        mount.appendChild(img);
      }
      document.title = "ready";
    </script>
  </body>
</html>
