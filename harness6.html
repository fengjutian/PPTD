<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>specimen-harness</title>
    <style>
      body { margin: 0; background: #fff; }
      img { display: block; width: 960px; }
    </style>
  </head>
  <body>
    <div id="out">loading</div>
    <script type="module">
      import { buildSpecimenDocument } from "/src/services/theme-specimen.ts";
      import { renderPresentationForVisualReview } from "/src/services/presentation-renderer.ts";
      const params = new URLSearchParams(location.search);
      const theme = params.get("theme") || "legal-burgundy";
      const page = Number.parseInt(params.get("page") || "0", 10);
      try {
        const presentation = buildSpecimenDocument({ themePresetId: theme });
        const rendered = await renderPresentationForVisualReview(presentation, 960);
        const source = rendered.slides[page] ?? rendered.slides[0];
        document.getElementById("out").innerHTML = `<img src="${source}" alt="specimen page">`;
        document.title = "ready";
      } catch (error) {
        document.getElementById("out").textContent = String(error);
        document.title = "error";
      }
    </script>
  </body>
</html>
